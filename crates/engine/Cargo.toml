[package]
name = "bloomai-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[features]
default = ["candle-engine"]
candle-engine = ["candle-core", "candle-nn", "candle-transformers", "tokenizers"]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal", "dep:metal", "dep:objc2-metal", "dep:candle-metal-kernels"]
flash-attn = ["candle-flash-attn"]
# Opt-in tests that need real hardware or external toolchains (GPU/NPU/Metal,
# the TileLang Python JIT, etc.). Excluded from default CI; enable with
# `cargo test --workspace --features hardware-tests`.
hardware-tests = []
# Embed the Dioxus UI (built separately in ui/ with `dx build --release`)
# into bloom_server and serve it at `/`. Disabled by default so the backend
# stays deployable on its own. Requires ui/dist to exist at compile time.
serve-ui = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
bloomai-core = { workspace = true }
bloomai-backend = { workspace = true }
bloomai-tilelang = { workspace = true }
candle-core = { version = "0.10", optional = true }
candle-nn = { version = "0.10", optional = true }
candle-transformers = { version = "0.10", optional = true }
tokenizers = { version = "0.23", optional = true }
candle-flash-attn = { version = "0.10", optional = true }
metal = { version = "0.29.0", optional = true }
objc2-metal = { version = "0.3.2", optional = true }
candle-metal-kernels = { version = "0.10.2", optional = true }
axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }
futures = "0.3"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
libloading = { workspace = true }
libc = "0.2"
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = { version = "2.2", default-features = false, features = ["std"] }
tower-http = { workspace = true }
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
