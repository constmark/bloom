[package]
name = "bloom-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
authors = ["Bloom Contributors"]
license = "Apache-2.0"
description = "Dioxus UI for the Bloom inference server (decoupled frontend; web today, desktop-ready)."
repository = "https://github.com/constmark/bloom"
homepage = "https://github.com/constmark/bloom"
publish = false

# Standalone crate, intentionally outside the engine workspace: it targets
# wasm32 and is built with `dx`, not with the native `cargo` workspace.
[workspace]

[dependencies]
dioxus = { version = "0.7.9", features = ["web"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "console",
  "Storage",
  "Window",
  "Performance",
  "Navigator",
  "MediaDevices",
  "MediaStream",
  "MediaStreamConstraints",
  "MediaStreamTrack",
  "AudioBuffer",
  "AudioContext",
  "AudioDestinationNode",
  "AudioNode",
  "AudioProcessingEvent",
  "MediaStreamAudioSourceNode",
  "ScriptProcessorNode",
  "Location",
  "Document",
  "AbortController",
  "AbortSignal",
  "Headers",
  "Request",
  "RequestInit",
  "Response",
  "ReadableStream",
  "ReadableStreamDefaultReader",
  "TextDecoder",
  "TextDecodeOptions",
  "Blob",
  "BlobPropertyBag",
  "CssStyleDeclaration",
  "File",
  "FormData",
  "HtmlElement",
  "HtmlAnchorElement",
  "HtmlTextAreaElement",
  "Element",
  "Node",
  "NodeList",
  "Url",
  "ScrollBehavior",
  "ScrollToOptions",
] }
gloo-net = { version = "0.6", features = ["http"] }
gloo-timers = { version = "0.4", features = ["futures"] }
futures-util = "0.3"
js-sys = "0.3"
tracing = "0.1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
