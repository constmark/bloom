[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bloom-sdk"
version = "0.1.0"
description = "Python SDK for the Bloom standalone multimodal inference engine (ctypes binding to the bloomai-ffi library)."
readme = "../README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "Bloom Contributors" }]
keywords = ["inference", "edge-ai", "multimodal", "llm", "rust-ffi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/constmark/bloom"
Repository = "https://github.com/constmark/bloom"
Documentation = "https://github.com/constmark/bloom/tree/main/docs"
Issues = "https://github.com/constmark/bloom/issues"
Changelog = "https://github.com/constmark/bloom/blob/main/CHANGELOG.md"

# The SDK locates the compiled bloomai-ffi cdylib at runtime via the
# BLOOM_FFI_LIB environment variable or by scanning the workspace
# target/ directory. Build the native library first with:
#   cargo build --release -p bloomai-ffi
[tool.setuptools]
packages = ["bloom_sdk"]
