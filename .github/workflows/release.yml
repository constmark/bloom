name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  checks:
    name: Required release checks
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.os }}
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.97.1"
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/schema-validation.txt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install pinned metadata validators
        run: python -m pip install --disable-pip-version-check -r requirements/schema-validation.txt
      - name: Validate public JSON artifacts
        run: |
          python scripts/validate_json_artifacts.py
          python scripts/test_model_catalog_schemas.py
      - name: Check local Markdown links
        run: python scripts/check_markdown_links.py
      - name: Check community metadata
        run: |
          python scripts/check_community_metadata.py
          python scripts/test_community_metadata.py
      - name: Check immutable GitHub Action references
        run: python scripts/check_github_action_pins.py
      - name: Check release workflow security
        run: |
          python scripts/check_release_workflow_security.py
          python scripts/test_release_workflow_security.py
          python scripts/test_install_ui_toolchain.py
      - name: Test deterministic release archives
        run: python scripts/test_create_release_archive.py
      - name: Check Rust toolchain consistency
        run: python scripts/check_toolchain_consistency.py
      - name: Test dependency policy and SBOM contract
        run: python scripts/test_generate_sbom.py
      - name: Test readiness contract validator
        run: python scripts/check_readiness_contract.py
      - name: Install Dioxus build dependencies
        shell: bash
        run: |
          if [ "${RUNNER_OS}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y libssl-dev pkg-config
          elif [ "${RUNNER_OS}" = "macOS" ]; then
            brew install openssl@3 pkg-config
          fi
      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.10 --locked --features no-downloads
      - name: Install verified UI build tools
        shell: bash
        run: |
          export BLOOM_UI_TOOL_INSTALL_DIR="$RUNNER_TEMP/bloom-ui-tools"
          export PATH="$BLOOM_UI_TOOL_INSTALL_DIR/bin:$PATH"
          python scripts/install_ui_toolchain.py
          echo "$BLOOM_UI_TOOL_INSTALL_DIR/bin" >> "$GITHUB_PATH"
      - name: Build and self-check application archive
        shell: bash
        env:
          NO_DOWNLOADS: "1"
        run: |
          ./scripts/package_release.sh
          host_target=$(rustc -vV | awk '/^host:/ {print $2}' | tr -d '\r')
          if [ "${RUNNER_OS}" = "Windows" ]; then
            archive_extension="zip"
          else
            archive_extension="tar.gz"
          fi
          source_archive="release-artifacts/bloom-${host_target}.${archive_extension}"
          release_archive="bloom-${GITHUB_REF_NAME}-${host_target}.${archive_extension}"
          mv "$source_archive" "$release_archive"
          python - "$release_archive" <<'PY'
          import hashlib
          import pathlib
          import sys

          archive = pathlib.Path(sys.argv[1])
          digest = hashlib.sha256()
          with archive.open("rb") as handle:
              for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                  digest.update(chunk)
          pathlib.Path(f"{archive}.sha256").write_text(
              f"{digest.hexdigest()}  {archive.name}\n", encoding="utf-8"
          )
          PY
          python scripts/validate_release_artifact.py "$release_archive" \
            --checksum "${release_archive}.sha256" \
            --require-embedded-ui \
            --require-native-self-check \
            --require-deterministic-metadata
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bloom-${{ matrix.os }}
          if-no-files-found: error
          path: |
            bloom-*.tar.gz
            bloom-*.zip
            bloom-*.sha256

  github-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Attest release archives and checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.sha256
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.sha256
          draft: true
          generate_release_notes: true
