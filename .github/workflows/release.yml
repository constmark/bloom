name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.97.1"
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/schema-validation.txt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install pinned metadata validators
        run: python -m pip install --disable-pip-version-check -r requirements/schema-validation.txt
      - name: Validate public JSON artifacts
        run: python scripts/validate_json_artifacts.py
      - name: Check local Markdown links
        run: python scripts/check_markdown_links.py
      - name: Check community metadata
        run: |
          python scripts/check_community_metadata.py
          python scripts/test_community_metadata.py
      - name: Check immutable GitHub Action references
        run: python scripts/check_github_action_pins.py
      - name: Check release workflow security
        run: |
          python scripts/check_release_workflow_security.py
          python scripts/test_release_workflow_security.py
      - name: Test deterministic release archives
        run: python scripts/test_create_release_archive.py
      - name: Check Rust toolchain consistency
        run: python scripts/check_toolchain_consistency.py
      - name: Test readiness contract validator
        run: python scripts/check_readiness_contract.py
      - name: Install Dioxus build dependencies
        shell: bash
        run: |
          if [ "${RUNNER_OS}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y libssl-dev pkg-config
          elif [ "${RUNNER_OS}" = "macOS" ]; then
            brew install openssl@3 pkg-config
          fi
      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.10 --locked
      - name: Cache pinned trained Qwen2 model
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/bloom-trained-qwen2-runtime
          key: trained-qwen2-q4-aca679832ded61145239ce7f5c5ebddb1c57ada786c9c23733899c3888e0596f
      - name: Test pinned trained Qwen2 CPU runtime
        if: runner.os == 'Linux'
        run: ./scripts/test_trained_qwen2_runtime.sh
      - name: Cache pinned trained Qwen3 model
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/bloom-trained-qwen3-runtime
          key: trained-qwen3-q8-9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031
      - name: Test pinned trained Qwen3 CPU runtime
        if: runner.os == 'Linux'
        run: ./scripts/test_trained_qwen3_runtime.sh
      - name: Cache pinned trained SmolLM2 Llama model
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/bloom-trained-llama-runtime
          key: trained-llama-q8-48ab3034d0dd401fbc721eb1df3217902fee7dab9078992d66431f09b7750201
      - name: Test pinned trained SmolLM2 Llama CPU runtime
        if: runner.os == 'Linux'
        run: ./scripts/test_trained_llama_runtime.sh
      - name: Cache pinned trained SmolLM2 Safetensors model
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/bloom-trained-safetensors-runtime
          key: trained-safetensors-bf16-e6bffe7435d7ddc10fd3b9a9efd429dafbacb1cb17015fb5562664e7532bf86e
      - name: Test pinned trained SmolLM2 Safetensors CPU runtime
        if: runner.os == 'Linux'
        run: ./scripts/test_trained_safetensors_runtime.sh
      - name: Cache pinned trained MiniLM embedding model
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/bloom-trained-embedding-runtime
          key: trained-embedding-minilm-f32-53aa51172d142c89d9012cce15ae4d6cc0ca6895895114379cacb4fab128d9db
      - name: Test pinned trained MiniLM CPU embedding runtime
        if: runner.os == 'Linux'
        run: ./scripts/test_trained_embedding_runtime.sh
      - name: Build and self-check application archive
        shell: bash
        run: |
          ./scripts/package_release.sh
          host_target=$(rustc -vV | awk '/^host:/ {print $2}' | tr -d '\r')
          if [ "${RUNNER_OS}" = "Windows" ]; then
            archive_extension="zip"
          else
            archive_extension="tar.gz"
          fi
          source_archive="release-artifacts/bloom-${host_target}.${archive_extension}"
          release_archive="bloom-${GITHUB_REF_NAME}-${host_target}.${archive_extension}"
          mv "$source_archive" "$release_archive"
          python - "$release_archive" <<'PY'
          import hashlib
          import pathlib
          import sys

          archive = pathlib.Path(sys.argv[1])
          digest = hashlib.sha256()
          with archive.open("rb") as handle:
              for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                  digest.update(chunk)
          pathlib.Path(f"{archive}.sha256").write_text(
              f"{digest.hexdigest()}  {archive.name}\n", encoding="utf-8"
          )
          PY
          python scripts/validate_release_artifact.py "$release_archive" \
            --checksum "${release_archive}.sha256" \
            --require-embedded-ui \
            --require-native-self-check \
            --require-deterministic-metadata
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bloom-${{ matrix.os }}
          if-no-files-found: error
          path: |
            bloom-*.tar.gz
            bloom-*.zip
            bloom-*.sha256

  github-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Attest release archives and checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.sha256
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.sha256
          draft: true
          generate_release_notes: true
