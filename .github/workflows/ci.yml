name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    name: Rust (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/compat-smoke.txt
            requirements/schema-validation.txt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install pinned official compatibility clients
        run: python -m pip install --disable-pip-version-check -r requirements/compat-smoke.txt
      - name: Install pinned metadata validators
        run: python -m pip install --disable-pip-version-check -r requirements/schema-validation.txt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check local Markdown links
        run: python3 scripts/check_markdown_links.py
      - name: Check community metadata
        run: |
          python3 scripts/check_community_metadata.py
          python3 scripts/test_community_metadata.py
      - name: Check immutable GitHub Action references
        run: python3 scripts/check_github_action_pins.py
      - name: Check release workflow security
        run: |
          python3 scripts/check_release_workflow_security.py
          python3 scripts/test_release_workflow_security.py
      - name: Test deterministic release archives
        run: python3 scripts/test_create_release_archive.py
      - name: Check Rust toolchain consistency
        run: python3 scripts/check_toolchain_consistency.py
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        # -D warnings keeps CI strict; -A missing_docs opts out of the
        # documentation lint so it does not block PRs while docs catch up.
        run: cargo clippy --workspace --all-targets --locked -- -D warnings -A missing_docs
      - name: Test
        run: cargo test --workspace --locked
      - name: Test server shutdown lifecycle
        run: python3 scripts/test_server_shutdown.py
      - name: Test server HTTP boundary
        run: python3 scripts/test_server_http_boundary.py
      - name: Test native CPU model runtime
        # Generates deterministic text, structured-output, and tool-call Qwen2
        # artifacts and requires both pinned clients on the real Candle path.
        run: ./scripts/test_tiny_model_runtime.sh --require-official-clients
      - name: Cache pinned trained Qwen2 model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/bloom-trained-qwen2-runtime
          key: trained-qwen2-q4-aca679832ded61145239ce7f5c5ebddb1c57ada786c9c23733899c3888e0596f
      - name: Test pinned trained Qwen2 CPU runtime
        # Verifies immutable model and license hashes before real quantized
        # instruction following, benchmarking, and both HTTP adapters.
        run: ./scripts/test_trained_qwen2_runtime.sh
      - name: Cache pinned trained Qwen3 model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/bloom-trained-qwen3-runtime
          key: trained-qwen3-q8-9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031
      - name: Test pinned trained Qwen3 CPU runtime
        # Crosses architecture-specific loading and disabled-thinking prompts
        # before benchmarking and exercising both HTTP adapters.
        run: ./scripts/test_trained_qwen3_runtime.sh
      - name: Cache pinned trained SmolLM2 Llama model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/bloom-trained-llama-runtime
          key: trained-llama-q8-48ab3034d0dd401fbc721eb1df3217902fee7dab9078992d66431f09b7750201
      - name: Test pinned trained SmolLM2 Llama CPU runtime
        # Crosses the Llama loader and safe classified ChatML prompt selection
        # before benchmarking and exact-output testing on both HTTP adapters.
        run: ./scripts/test_trained_llama_runtime.sh
      - name: Cache pinned trained SmolLM2 Safetensors model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/bloom-trained-safetensors-runtime
          key: trained-safetensors-bf16-e6bffe7435d7ddc10fd3b9a9efd429dafbacb1cb17015fb5562664e7532bf86e
      - name: Test pinned trained SmolLM2 Safetensors CPU runtime
        # Crosses the native HF package loader, bounded prompt metadata,
        # BF16-storage/F32-runtime accounting, and both HTTP adapters.
        run: ./scripts/test_trained_safetensors_runtime.sh
      - name: Cache pinned trained MiniLM embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/bloom-trained-embedding-runtime
          key: trained-embedding-minilm-f32-53aa51172d142c89d9012cce15ae4d6cc0ca6895895114379cacb4fab128d9db
      - name: Test pinned trained MiniLM CPU embedding runtime
        # Proves native BERT loading, semantic separation, bi-encoder reranking,
        # task isolation, both protocol adapters, and pinned SDK decoding.
        run: ./scripts/test_trained_embedding_runtime.sh --require-official-clients
      - name: Package and check exact crate release set
        run: ./scripts/test_crate_packages.sh
      - name: Check CUDA features when nvcc is available
        run: |
          if command -v nvcc >/dev/null 2>&1; then
            cargo check --workspace --all-targets --features cuda --locked
            cargo clippy --workspace --all-targets --features cuda --locked -- -D warnings -A missing_docs
          else
            echo "SKIP: nvcc not found; CUDA feature checks require a CUDA runner"
          fi
      - name: Validate JSON artifacts
        run: ./scripts/validate_json_artifacts.py
      - name: Test readiness contract validator
        run: python3 scripts/check_readiness_contract.py
      - name: Test release artifact validator
        run: python3 scripts/test_validate_release_artifact.py
      - name: Benchmark smoke
        # Script SKIPs gracefully (exit 0) when no model is present.
        run: ./scripts/ci_smoke_test.sh
      - name: OpenAI API smoke
        # Discovery, SDK decoding, auth, and fail-closed admission run without a model.
        run: ./scripts/openai_compat_smoke.py --api-key bloom-ci-smoke --require-openai-sdk
      - name: Ollama API smoke
        # Discovery, SDK decoding, auth, and fail-closed admission run without a model.
        run: ./scripts/ollama_compat_smoke.py --api-key bloom-ci-smoke --require-ollama-sdk
      - name: llama.cpp comparison smoke
        # Script SKIPs gracefully (exit 0) when model or llama.cpp is missing.
        run: ./scripts/compare_llamacpp.py
      - name: Docker build smoke
        run: docker build -t bloom:ci .

  macos:
    name: Rust (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Check (Metal features)
        run: cargo check --workspace --all-targets --features metal --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features metal --locked -- -D warnings -A missing_docs
      - name: Test
        run: cargo test --workspace --features metal --locked

  windows:
    name: Rust (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings -A missing_docs
      - name: Test
        run: cargo test --workspace --locked
      - name: Package server-only zip smoke
        shell: bash
        run: |
          BLOOM_PACKAGE_UI=0 ./scripts/package_release.sh
          host_target=$(rustc -vV | awk '/^host:/ {print $2}' | tr -d '\r')
          python scripts/validate_release_artifact.py \
            "release-artifacts/bloom-${host_target}.zip" \
            --checksum release-artifacts/SHA256SUMS \
            --require-native-self-check \
            --require-deterministic-metadata

  ui:
    name: Dioxus UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            ui -> ui/target
      - name: Format
        run: cargo fmt --manifest-path ui/Cargo.toml -- --check
      - name: Check WebAssembly target
        run: cargo check --manifest-path ui/Cargo.toml --target wasm32-unknown-unknown --all-targets --locked
      - name: Test state and protocol logic
        run: cargo test --manifest-path ui/Cargo.toml --locked
      - name: Clippy
        run: cargo clippy --manifest-path ui/Cargo.toml --all-targets --locked -- -D warnings

  docs:
    name: Documentation lint (non-blocking)
    runs-on: ubuntu-latest
    # Advisory only: surfaces missing rustdoc without blocking PRs.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Missing docs (advisory)
        run: cargo clippy --workspace --all-targets --locked -- -W missing_docs
      - name: rustdoc build
        run: cargo doc --workspace --no-deps --locked

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
