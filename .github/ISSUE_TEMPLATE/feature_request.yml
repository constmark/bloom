name: Feature request
description: Propose a focused, testable improvement to Bloom.
title: "[Feature]: "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Explain the user problem before prescribing an implementation. Search
        existing issues and review the roadmap and support matrix first.

        Do not include API keys, Authorization headers, signed URLs, local paths,
        private model data, or private prompts and responses. Send security
        vulnerabilities through the private advisory link below.
  - type: dropdown
    id: surface
    attributes:
      label: Product area
      options:
        - Browser UI
        - OpenAI compatibility
        - Ollama compatibility
        - Model management or acquisition
        - Native runtime or scheduling
        - Packaging or deployment
        - Developer API or SDK
        - Documentation or community
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who is blocked, what are they trying to do, and why is the current behavior insufficient?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior without assuming a particular implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Optional design sketch, API shape, or interaction flow.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds or simpler alternatives.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance evidence
      description: List concrete behavior and CPU-only tests that would prove the request is complete.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Compatibility and constraints
      description: Note affected clients, models, platforms, privacy boundaries, or migration concerns.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This proposal contains no credentials, private paths, model data, prompts, or responses.
          required: true
    validations:
      required: true
  - type: checkboxes
    id: security
    attributes:
      label: Security routing
      description: Use a [private security advisory](https://github.com/constmark/bloom/security/advisories/new) for vulnerabilities.
      options:
        - label: This request does not disclose a security vulnerability.
          required: true
    validations:
      required: true
  - type: checkboxes
    id: english
    attributes:
      label: Project language
      options:
        - label: This request is written in English.
          required: true
    validations:
      required: true
  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow the [Code of Conduct](https://github.com/constmark/bloom/blob/main/CODE_OF_CONDUCT.md).
          required: true
    validations:
      required: true
