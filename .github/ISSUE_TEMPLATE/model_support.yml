name: Model or backend support
description: Request evidence-backed support for a model, format, quantization, task, or device.
title: "[Support]: "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Review the support matrix before filing. Stable support requires a public,
        immutable, license-reviewed source plus reproducible correctness and
        performance evidence; format recognition alone is not execution support.

        Do not include API keys, Authorization headers, signed URLs, local paths,
        private model data, or private prompts and responses. Send security
        vulnerabilities through the private advisory link below.
  - type: dropdown
    id: request_type
    attributes:
      label: Requested support
      options:
        - Model architecture
        - File format or quantization
        - Backend or device
        - External runtime
        - Embedding or reranking
        - Multimodal input or output
    validations:
      required: true
  - type: input
    id: model_family
    attributes:
      label: Model family
      description: Use N/A only for a backend-only request.
      placeholder: "Example: Llama 3"
    validations:
      required: true
  - type: input
    id: public_source
    attributes:
      label: Public immutable source
      description: Provide a public repository and exact commit, or N/A for a backend-only request.
      placeholder: "Example: https://huggingface.co/publisher/model/tree/012345..."
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: License
      description: Provide the SPDX identifier or exact upstream license name; use Unknown if unresolved.
      placeholder: "Example: Apache-2.0"
    validations:
      required: true
  - type: input
    id: format
    attributes:
      label: Format and precision
      description: Include container, quantization or dtype, and package shape.
      placeholder: "Example: GGUF Q4_K_M single-file"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Target backend and device
      placeholder: "Example: Candle CPU on x86_64 Linux"
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Expected workflow
      description: Describe the exact Bloom UI, API, or CLI task this support should enable.
    validations:
      required: true
  - type: textarea
    id: current_result
    attributes:
      label: Current result and evidence
      description: Include a minimal redacted command or error and any public tiny fixture or benchmark source.
    validations:
      required: false
  - type: checkboxes
    id: evidence
    attributes:
      label: Evidence boundary
      options:
        - label: I understand that stable support requires pinned model, license, correctness, and benchmark evidence.
          required: true
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This request contains no credentials, private paths, model data, prompts, or responses.
          required: true
    validations:
      required: true
  - type: checkboxes
    id: security
    attributes:
      label: Security routing
      description: Use a [private security advisory](https://github.com/constmark/bloom/security/advisories/new) for vulnerabilities.
      options:
        - label: This request does not disclose a security vulnerability.
          required: true
    validations:
      required: true
  - type: checkboxes
    id: english
    attributes:
      label: Project language
      options:
        - label: This request is written in English.
          required: true
    validations:
      required: true
  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow the [Code of Conduct](https://github.com/constmark/bloom/blob/main/CODE_OF_CONDUCT.md).
          required: true
    validations:
      required: true
